name: Auto Studio Crawler

on:
  schedule:
    # 1. 毎朝起動 JST 07:30, 08:00, 08:30, 09:00, 09:30, 10:00, 10:30 (UTC 22:30, 23:xx, 00:xx, 01:xx)
    - cron: '30 22 * * *'        # JST 07:30 (全日)
    - cron: '*/30 23 * * *'      # JST 08:00, 08:30 (全日)
    - cron: '*/30 0-1 * * *'     # JST 09:00 〜 10:30 (全日)

    # 2. 平日昼間 (月〜金 JST 11:00 〜 17:00 / UTC 02:00 〜 08:00) -> 1時間に1回 (毎時00分のみ)
    - cron: '0 2-8 * * 1-5'      # JST 11:00, 12:00, 13:00, 14:00, 15:00, 16:00, 17:00 (月〜金)

    # 3. 休日昼間 (土日 JST 11:00 〜 17:00 / UTC 02:00 〜 08:00) -> 30分に1回
    - cron: '*/30 2-8 * * 0,6'   # JST 11:00 〜 17:30 (土日)

    # 4. 夜間帯 (全日 JST 17:30 〜 24:30, 01:00 / UTC 08:30 〜 15:30, 16:00) -> 30分に1回
    - cron: '30 8 * * 1-5'       # JST 17:30 (平日の夜開始枠)
    - cron: '*/30 9-15 * * *'    # JST 18:00 〜 24:30 (全日)
    - cron: '0 16 * * *'         # JST 01:00 (全日)
  workflow_dispatch: # GitHubの画面から手動で即座に実行可能

# リポジトリへのコミット＆プッシュ権限を付与
permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Studio Crawler
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run crawl

      - name: Commit and push updated studio data
        run: |
          git config --global user.name "SoundSpot Bot"
          git config --global user.email "bot@soundspot.local"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update studio availability via GitHub Actions [skip ci]"
            git push origin main
          fi
