name: Auto Studio Crawler

on:
  schedule:
    # 毎日固定 4回巡回: 06:33, 11:48, 17:18, 21:33 (JST)
    # ※世界中のcronが集中する00分・15分・30分・45分のピークを回避した端数設定
    # UTC換算:
    # 21:33 UTC -> JST 06:33 (朝枠)
    # 02:48 UTC -> JST 11:48 (昼枠)
    # 08:18 UTC -> JST 17:18 (夕方枠)
    # 12:33 UTC -> JST 21:33 (夜枠)
    - cron: '33 21 * * *'
    - cron: '48 2 * * *'
    - cron: '18 8 * * *'
    - cron: '33 12 * * *'
  workflow_dispatch: # GitHubの画面から手動で即座に実行可能

# リポジトリへのコミット＆プッシュ権限を付与
permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Studio Crawler (Pure Node fetch)
        continue-on-error: true
        env:
          # GitHub Actionsランナーの一部の外部ホスト（Supabase等）向けIPv6経路が不安定で
          # Node18+のfetch(undici)が "TypeError: fetch failed" で失敗する既知の問題を回避するため、
          # DNS解決順をIPv4優先に固定する。
          NODE_OPTIONS: '--dns-result-order=ipv4first'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # NOAH(studionoah.jp)はGitHub ActionsランナーのIPを403でブロックするため、
          # NOAHのクローリングはscripts/crawl-studios.ts側でGITHUB_ACTIONS=trueを検知してスキップする。
          # NOAH_LOGIN_ID / NOAH_PASSWORD はローカル実行時のみ .env.local から使用する。
        run: npm run crawl

      - name: Commit and push updated studio data
        run: |
          git config --global user.name "SoundSpot Bot"
          git config --global user.email "bot@soundspot.local"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update studio availability via GitHub Actions [skip ci]"
            git push origin main
          fi
