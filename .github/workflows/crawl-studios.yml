name: Auto Studio Crawler

on:
  schedule:
    # 毎日固定 4回巡回: 06:33, 11:48, 17:18, 21:33 (JST)
    # ※世界中のcronが集中する00分・15分・30分・45分のピークを回避した端数設定
    # UTC換算:
    # 21:33 UTC -> JST 06:33 (朝枠)
    # 02:48 UTC -> JST 11:48 (昼枠)
    # 08:18 UTC -> JST 17:18 (夕方枠)
    # 12:33 UTC -> JST 21:33 (夜枠)
    - cron: '33 21 * * *'
    - cron: '48 2 * * *'
    - cron: '18 8 * * *'
    - cron: '33 12 * * *'
  workflow_dispatch: # GitHubの画面から手動で即座に実行可能

# リポジトリへのコミット＆プッシュ権限を付与
permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Studio Crawler (Pure Node fetch)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOAH_LOGIN_ID: ${{ secrets.NOAH_LOGIN_ID }}
          NOAH_PASSWORD: ${{ secrets.NOAH_PASSWORD }}
          # 手動実行(workflow_dispatch)時は毎日固定4回スケジュールガードを無視して即時巡回する。
          # cronによる定時実行時は引き続きガードを適用する。
          IGNORE_GUARDS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run crawl

      - name: Commit and push updated studio data
        run: |
          git config --global user.name "SoundSpot Bot"
          git config --global user.email "bot@soundspot.local"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update studio availability via GitHub Actions [skip ci]"
            git push origin main
          fi
