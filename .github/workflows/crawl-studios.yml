name: Auto Studio Crawler

on:
  schedule:
    # 平日（月〜金）: 06:30, 11:45, 17:15, 21:30 (JST)
    # 休日・祝日: 08:30, 13:00, 17:15, 21:30 (JST)
    # UTC換算:
    # 21:30 UTC -> JST 06:30 (平日)
    # 23:30 UTC -> JST 08:30 (休日・祝日)
    # 02:45 UTC -> JST 11:45 (平日)
    # 04:00 UTC -> JST 13:00 (休日・祝日)
    # 08:15 UTC -> JST 17:15 (全日)
    # 12:30 UTC -> JST 21:30 (全日)
    - cron: '30 21 * * *'
    - cron: '30 23 * * *'
    - cron: '45 2 * * *'
    - cron: '0 4 * * *'
    - cron: '15 8 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch: # GitHubの画面から手動で即座に実行可能

# リポジトリへのコミット＆プッシュ権限を付与
permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Studio Crawler (Pure Node fetch)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOAH_LOGIN_ID: ${{ secrets.NOAH_LOGIN_ID }}
          NOAH_PASSWORD: ${{ secrets.NOAH_PASSWORD }}
        run: npm run crawl

      - name: Commit and push updated studio data
        run: |
          git config --global user.name "SoundSpot Bot"
          git config --global user.email "bot@soundspot.local"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update studio availability via GitHub Actions [skip ci]"
            git push origin main
          fi
