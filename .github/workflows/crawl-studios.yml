name: Auto Studio Crawler

on:
  schedule:
    # 平日（月〜金）: 06:33, 11:48, 17:18, 21:33 (JST)
    # 休日・祝日: 08:33, 13:03, 17:18, 21:33 (JST)
    # ※世界中のcronが集中する00分・15分・30分・45分を回避し、遅延やスキップを防ぐ端数設定
    # UTC換算:
    # 21:33 UTC -> JST 06:33 (平日)
    # 23:33 UTC -> JST 08:33 (休日・祝日)
    # 02:48 UTC -> JST 11:48 (平日)
    # 04:03 UTC -> JST 13:03 (休日・祝日)
    # 08:18 UTC -> JST 17:18 (全日)
    # 12:33 UTC -> JST 21:33 (全日)
    - cron: '33 21 * * *'
    - cron: '33 23 * * *'
    - cron: '48 2 * * *'
    - cron: '3 4 * * *'
    - cron: '18 8 * * *'
    - cron: '33 12 * * *'
  workflow_dispatch: # GitHubの画面から手動で即座に実行可能

# リポジトリへのコミット＆プッシュ権限を付与
permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Studio Crawler (Pure Node fetch)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOAH_LOGIN_ID: ${{ secrets.NOAH_LOGIN_ID }}
          NOAH_PASSWORD: ${{ secrets.NOAH_PASSWORD }}
        run: npm run crawl

      - name: Commit and push updated studio data
        run: |
          git config --global user.name "SoundSpot Bot"
          git config --global user.email "bot@soundspot.local"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update studio availability via GitHub Actions [skip ci]"
            git push origin main
          fi
