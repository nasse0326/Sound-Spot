name: Auto Studio Crawler

on:
  schedule:
    # 基本頻度: 2時間に1回（JST 08:00〜24:00の計9回/日）
    # 稼働時間: JST 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00, 24:00
    # UTC換算: 23:00, 01:00, 03:00, 05:00, 07:00, 09:00, 11:00, 13:00, 15:00
    - cron: '0 23,1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch: # GitHubの画面から手動で即座に実行可能

# リポジトリへのコミット＆プッシュ権限を付与
permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Studio Crawler (Pure Node fetch)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run crawl

      - name: Commit and push updated studio data
        run: |
          git config --global user.name "SoundSpot Bot"
          git config --global user.email "bot@soundspot.local"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update studio availability via GitHub Actions [skip ci]"
            git push origin main
          fi
