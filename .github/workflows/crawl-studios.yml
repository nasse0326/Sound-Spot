name: Auto Studio Crawler

on:
  schedule:
    # 基本頻度: 1時間に1回（毎時00分）
    # 稼働時間: JST 08:00 〜 24:00, 01:00（深夜01:30〜07:30は完全停止・スリープ）
    # UTC換算: 23:00 (JST 08:00) および 00:00〜16:00 (JST 09:00〜24:00, 01:00)
    - cron: '0 23 * * *'         # JST 08:00
    - cron: '0 0-16 * * *'       # JST 09:00 〜 24:00, 01:00 (毎時00分に1回)
  workflow_dispatch: # GitHubの画面から手動で即座に実行可能

# リポジトリへのコミット＆プッシュ権限を付与
permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Studio Crawler
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run crawl

      - name: Commit and push updated studio data
        run: |
          git config --global user.name "SoundSpot Bot"
          git config --global user.email "bot@soundspot.local"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update studio availability via GitHub Actions [skip ci]"
            git push origin main
          fi
